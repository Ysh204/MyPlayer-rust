name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: bun install

      - name: Build Desktop Bundles & Publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'MyPlayer Pro v__VERSION__'
          releaseBody: |
            ### MyPlayer Pro Desktop Release
            
            Download the installer or portable executable below for Windows:
            - **Setup Installer (Recommended)**: `MyPlayer-Pro_*_x64-setup.exe`
            - **MSI Enterprise Package**: `MyPlayer-Pro_*_x64_en-US.msi`
            
            #### Highlights:
            - Minimal obsidian glass aesthetic & frameless window
            - Instant direct autoplay & 60fps timeline tracking
            - 5-band parametric audio equalizer & Night Mode peak compressor
            - Precision subtitle vertical letterbox framing (10% - 105%)
            - Reorderable playlist queue
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

