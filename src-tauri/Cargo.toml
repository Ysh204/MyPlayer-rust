[package]
name = "my_player"
version = "1.0.0"
edition = "2021"

[lib]
name = "my_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.1.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
libmpv2 = { version = "4.0", optional = true }

[features]
default = []
native-mpv = ["dep:libmpv2"]

[profile.dev]
codegen-units = 1
incremental = false

[profile.dev.build-override]
codegen-units = 1
incremental = false

[profile.test]
codegen-units = 1
incremental = false

[profile.test.build-override]
codegen-units = 1
incremental = false

[profile.release]
codegen-units = 1
incremental = false
lto = false

[profile.release.build-override]
codegen-units = 1
incremental = false
